# Render blueprint. Keys are entered in the Render dashboard (sync: false), never stored here.
services:
  - type: web
    name: clearswath
    runtime: docker
    plan: free  # 512 MB and sleeps after 15 idle minutes; demo plans are computed once (WARM_DEMO), so it fits
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: PHOTO_KEY  # the same value as PHOTO_KEY in the Modal secret "clearswath-photo"
        sync: false
      - key: PHOTO_URL  # printed by: PYTHONPATH=train uv run --with modal modal deploy serve/weeds_modal.py
        value: https://clearswath--clearswath-photo-weeds-analyze.us-east.modal.run
      - key: ACCESS_CODE  # 16+ random characters (e.g. `openssl rand -base64 18`); shorter or missing = live runs refused
        sync: false
      - key: WARM_DEMO  # compute the Montana demo at startup, so the first visitor after a wake-up doesn't wait
        value: "1"
      - key: CLEARSWATH_LIVE_MODE  # set to "off" to stop all paid calls; the cached demo keeps working
        value: "on"
      - key: RUNS_PER_IP_PER_DAY
        value: "3"
      - key: DAILY_BUDGET_USD
        value: "5"
      - key: DAILY_RUN_CAP
        value: "200"
      - key: LLM_PROVIDER  # Muse Spark 1.3: the agent's explanation and the application record
        value: meta
      - key: AGENT_FALLBACK_PROVIDER  # answers for the agent if LLM_PROVIDER is down
        value: baseten
      - key: LABEL_PROVIDER  # Muse Spark Open on Baseten reads labels: the open-weight path Baseten verifies
        value: baseten
      - key: LABEL_FALLBACK_PROVIDER  # reads the label if Baseten is down or slow
        value: meta
