[project]
name = "clearswath"
version = "0.1.0"
description = "Pesticide label + field outline to legal spray zone and application record"
readme = "README.md"
authors = [
    { name = "Hunter Hagedorn", email = "dnilbyt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "planetary-computer>=1.0.0",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "pynhd>=0.20.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "simplekml>=1.3.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clearswath = "clearswath:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
