<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearSwath</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --go: #1a7f37; --adjust: #b35900; --nogo: #c62828; --ink: #1d2327; --muted: #5f6b73;
          --line: #d8dee2; --bg: #f5f7f6; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); background: var(--bg); }
  header { padding: 12px 20px; background: #12352a; color: #fff; display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; }
  header span { opacity: .8; font-size: 14px; }
  main { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 50px); }
  aside { overflow-y: auto; padding: 16px; border-right: 1px solid var(--line); background: var(--card); }
  #map { height: 100%; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
  input, select, button { font: inherit; }
  input[type=month], select { padding: 6px; border: 1px solid var(--line); border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { padding: 9px; border: 0; border-radius: 6px; background: #12352a; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #e4ebe8; color: var(--ink); }
  button:disabled { opacity: .6; cursor: wait; }
  #status { margin: 16px 0 8px; padding: 14px; border-radius: 8px; color: #fff; font-size: 28px; font-weight: 800; text-align: center; letter-spacing: .04em; }
  .go { background: var(--go); } .adjust { background: var(--adjust); } .no-go { background: var(--nogo); }
  .acres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 12px; }
  .acres div { background: var(--bg); border-radius: 6px; padding: 6px; }
  .acres b { display: block; font-size: 18px; }
  .acres small { color: var(--muted); }
  .warn { background: #fff4e5; border: 2px solid var(--adjust); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .warn h3 { margin: 0 0 6px; font-size: 14px; color: var(--adjust); }
  .warn ul { margin: 0; padding-left: 18px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  .reason { border-left: 4px solid var(--line); padding: 4px 10px; margin-bottom: 8px; }
  .reason.label { border-color: #1565c0; } .reason.bulletin { border-color: var(--nogo); } .reason.rule\:water { border-color: #0097a7; }
  .reason blockquote { margin: 4px 0; font-style: italic; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; }
  .error { color: var(--nogo); font-weight: 600; }
  a.kml { display: block; text-align: center; margin-top: 12px; padding: 9px; border: 2px solid #12352a; border-radius: 6px; color: #12352a; font-weight: 700; text-decoration: none; }
  label.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .agent { background: #eef4fb; border-left: 4px solid #1565c0; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
  .agent p { margin: 4px 0; white-space: pre-line; }
  .agent details { font-size: 13px; color: var(--muted); }
  .agent ol { margin: 4px 0; padding-left: 20px; }
  .confirm { background: #fffbe6; border: 1px solid #e6c200; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .confirm h3 { margin: 0 0 4px; font-size: 14px; }
  .confirm label.check { align-items: flex-start; font-size: 13px; margin: 6px 0; }
  .record { display: grid; gap: 8px; }
  textarea { font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  table.rec { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  table.rec th { text-align: left; color: var(--muted); font-weight: 600; padding: 3px 8px 3px 0; white-space: nowrap; }
  table.rec td { padding: 3px 0; }
  table.rec tr.gap td { color: var(--nogo); font-weight: 700; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
</style>
</head>
<body>
<header><h1>ClearSwath</h1><span>Pesticide label + field &rarr; legal spray zone</span></header>
<main>
  <aside>
    <form id="form">
      <label>Field outline (GeoJSON)<input type="file" name="field" accept=".geojson,.json" required></label>
      <label>Pesticide label (PDF or photo)<input type="file" name="label" accept=".pdf,.png,.jpg,.jpeg,.webp" required></label>
      <div class="row">
        <label>Month<input type="month" name="month" required></label>
        <label>Method<select name="method"><option value="drone">Drone</option><option value="ground">Ground</option></select></label>
      </div>
      <label class="check"><input type="checkbox" name="agent"> Ask the Muse Spark agent to explain</label>
      <div class="row">
        <button type="submit">Plan spray</button>
        <button type="button" class="secondary" id="demo">Try demo</button>
      </div>
    </form>
    <p id="busy" class="meta" hidden>Reading label, finding hazards and checking bulletins&hellip;</p>
    <p id="error" class="error" role="alert"></p>
    <section id="result" hidden aria-live="polite"></section>
  </aside>
  <div id="map" aria-label="Map of the field and spray zone"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (s) => document.querySelector(s);
const form = $("#form");
form.month.value = new Date().toISOString().slice(0, 7);

const map = L.map("map").setView([42, -93], 5);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
}).addTo(map);
const control = L.control.layers(null, null, { collapsed: false }).addTo(map);
let overlays = [];

const STYLES = {
  spray_zone: ["Spray zone", { color: "#1a7f37", fillOpacity: 0.35, weight: 1 }],
  no_spray: ["No spray", { color: "#c62828", fillOpacity: 0.4, weight: 1 }],
  restricted: ["Bulletin area", { color: "#6a1b9a", fillOpacity: 0.25, dashArray: "4" }],
  water: ["Water", { color: "#29b6f6", fillOpacity: 0.5, weight: 2 }],
  building: ["Buildings", { color: "#ffb300", fillOpacity: 0.5, weight: 1 }],
  habitat: ["Habitat", { color: "#7cb342", fillOpacity: 0.3, weight: 1 }],
  field: ["Field", { color: "#fff", fill: false, weight: 3 }],
};

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === "class" ? (e.className = v) : e.setAttribute(k, v)));
  kids.flat().forEach((k) => k != null && e.append(k));
  return e;
}

function drawMap(layers) {
  overlays.forEach((l) => { map.removeLayer(l); control.removeLayer(l); });
  overlays = [];
  for (const [key, [name, style]] of Object.entries(STYLES)) {
    const data = layers[key];
    if (!data || (data.features && !data.features.length)) continue;
    const layer = L.geoJSON(data, { style }).addTo(map);
    control.addOverlay(layer, name);
    overlays.push(layer);
    if (key === "field") map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  }
}

function render(r) {
  const out = $("#result");
  const status = { go: "GO", adjust: "ADJUST", "no-go": "NO-GO" }[r.status];
  const acres = r.acres;
  out.replaceChildren(...[
    r.demo ? el("p", { class: "meta" }, `Demo field${r.demo.cached ? ` (saved run, bulletin for ${r.demo.month})` : ""} \u00b7 `,
      el("a", { href: "#", id: "demo-switch" }, r.demo.field ? "Show the field drawn up to the creek" : "Show the corrected field")) : null,
    el("div", { id: "status", class: r.status }, status),
    el("div", { class: "acres" },
      el("div", {}, el("b", {}, acres.field_acres.toFixed(1)), el("small", {}, "field ac")),
      el("div", {}, el("b", {}, acres.spray_acres.toFixed(1)), el("small", {}, "sprayable ac")),
      el("div", {}, el("b", {}, acres.excluded_acres.toFixed(1)), el("small", {}, "excluded ac"))),
    r.warnings.length ? el("div", { class: "warn", role: "alert" },
      el("h3", {}, "Check before spraying"), el("ul", {}, r.warnings.map((w) => el("li", {}, w)))) : null,
    r.confirm.length ? el("div", { class: "confirm" },
      el("h3", {}, r.label.source === "image" ? "Confirm rules read from the photo" : "Rules that may not apply to you"),
      el("p", { class: "meta" }, "Applied unless you untick them. Unticking is recorded in the result."),
      r.confirm.map((c) => el("label", { class: "check" },
        el("input", { type: "checkbox", "data-rule": String(c.id), ...(c.applied ? { checked: "" } : {}) }),
        el("span", {}, `${c.summary} (p.${c.page}${c.condition ? `, only when ${c.condition}` : ""})`)))) : null,
    r.answer ? el("div", { class: "agent" },
      el("div", { class: "tag" }, r.mode === "agent" ? "Muse Spark agent" : "Agent unavailable · plan summary"),
      el("p", {}, r.answer),
      el("details", {}, el("summary", {}, "How it decided"),
        el("ol", {}, r.trace.map((t) => el("li", {}, t.tool
          ? `${t.tool}${t.seconds != null ? ` (${t.seconds}s)` : ""}${t.note ? ` — ${t.note}` : ""}`
          : t.note))))) : null,
    el("h2", {}, "Why"),
    r.reasons.length ? r.reasons.map((x) => el("div", { class: `reason ${x.source}` },
      el("div", { class: "tag" }, x.source === "label" ? `Label p.${x.page} · ${x.distance_ft} ft from ${x.target}` : x.source),
      el("div", {}, x.summary),
      x.quote ? el("blockquote", {}, `“${x.quote}”`) : null)) : el("p", { class: "meta" }, "No hazards or limitations affect this field."),
    el("h2", {}, "Product"),
    el("p", {}, `${r.label.product_name || "Unknown product"} · EPA Reg. No. ${r.label.epa_reg_no || "not found"}`),
    el("p", { class: "meta" }, r.bulletin.citation),
    el("p", { class: "meta" }, `Imagery ${r.imagery_date || "unknown"} · water from ${r.water_source} · ${r.method}, ${r.month}`),
    el("a", { class: "kml", href: `/api/kml/${r.run_id}`, download: "" }, "Download KML for sprayer"),
    el("h2", {}, "Record application"),
    el("form", { id: "record", class: "record" },
      el("label", {}, "Voice note (WAV)", el("input", { type: "file", name: "audio", accept: ".wav,audio/wav" })),
      el("label", {}, "or type notes", el("textarea", { name: "text", rows: "3",
        placeholder: "Sam Ortiz, cert IA-12345, 12 gallons on soybeans, wind 6 mph NW, 58 degrees" })),
      el("button", { type: "submit" }, "Fill record")),
    el("div", { id: "record-out" }),
  ].flat().filter(Boolean));
  $("#record").addEventListener("submit", (e) => recordApplication(e, r.run_id));
  out.hidden = false;
  drawMap(r.layers);
}

async function call(url, opts) {
  $("#error").textContent = "";
  $("#busy").hidden = false;
  form.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const res = await fetch(url, opts);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${res.status})`);
    render(body);
  } catch (e) {
    $("#error").textContent = e.message;
  } finally {
    $("#busy").hidden = true;
    form.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

const RECORD_FIELDS = [
  ["applicator_name", "Applicator"], ["certification_number", "Certification no."],
  ["application_date", "Date"], ["start_time", "Start"], ["end_time", "End"],
  ["product_name", "Product"], ["epa_reg_no", "EPA Reg. No."], ["amount_applied", "Amount applied"],
  ["rate", "Rate"], ["area_treated_acres", "Area (ac)"], ["crop_or_site", "Crop / site"],
  ["location", "Location"], ["method", "Method"], ["wind_speed_mph", "Wind (mph)"],
  ["wind_direction", "Wind from"], ["temperature_f", "Temp (°F)"], ["notes", "Notes"],
];

async function recordApplication(e, runId) {
  e.preventDefault();
  const f = e.target, out = $("#record-out"), body = new FormData();
  body.append("run_id", runId);
  if (f.audio.files[0]) body.append("audio", f.audio.files[0]);
  body.append("text", f.text.value);
  f.querySelector("button").disabled = true;
  out.replaceChildren(el("p", { class: "meta" }, "Filling record…"));
  try {
    const res = await fetch("/api/record", { method: "POST", body });
    const rec = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof rec.detail === "string" ? rec.detail : `Request failed (${res.status})`);
    out.replaceChildren(...[
      rec.missing.length ? el("div", { class: "warn", role: "alert" }, el("h3", {}, "Still needed"),
        el("ul", {}, rec.missing.map((k) => el("li", {}, RECORD_FIELDS.find(([f]) => f === k)?.[1] || k)))) : null,
      el("table", { class: "rec" }, RECORD_FIELDS.map(([k, name]) => el("tr", { class: rec.missing.includes(k) ? "gap" : "" },
        el("th", {}, name), el("td", {}, rec[k] ?? "—")))),
      el("p", { class: "meta" }, `Heard: “${rec.transcript}”`),
    ].filter(Boolean));
  } catch (err) {
    out.replaceChildren(el("p", { class: "error" }, err.message));
  } finally {
    f.querySelector("button").disabled = false;
  }
}

// Re-runs the last request with the rules the user unticked.
let rerun = null;
$("#result").addEventListener("change", (e) => {
  if (!e.target.dataset.rule || !rerun) return;
  const off = [...document.querySelectorAll("[data-rule]")].filter((b) => !b.checked).map((b) => b.dataset.rule);
  rerun(off.join(","));
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const url = form.agent.checked ? "/api/agent" : "/api/plan";
  rerun = (excluded) => {
    const body = new FormData(form);
    body.delete("agent");
    body.append("excluded_rules", excluded);
    return call(url, { method: "POST", body });
  };
  rerun("");
});
let demoField = "";
function demoRun(excluded) {
  const q = `month=${form.month.value}&method=${form.method.value}&field=${demoField}`;
  return call(`/api/demo?${q}&excluded_rules=${excluded}`);
}
$("#demo").addEventListener("click", () => {
  demoField = "";
  rerun = demoRun;
  rerun("");
});
// Switch between the demo outlines, keeping the user's unticked rules (same label, same ids).
$("#result").addEventListener("click", (e) => {
  if (e.target.id !== "demo-switch") return;
  e.preventDefault();
  demoField = demoField ? "" : "corrected";
  const off = [...document.querySelectorAll("[data-rule]")].filter((b) => !b.checked).map((b) => b.dataset.rule);
  rerun(off.join(","));
});
</script>
</body>
</html>
